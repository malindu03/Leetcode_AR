name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Reads the version from .nvmrc so we use the same Node.
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      # If the lock file and package.json disagree, it fails.
      - run: npm ci

      - run: npm run build
      # Uploads the extension to be used in the release workflow.
      - uses: actions/upload-artifact@v7
        with:
          name: extension
          path: dist/
